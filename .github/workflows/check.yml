name: VPN Gate Node Check
on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-check
  cancel-in-progress: true  # 新版本推荐：新任务触发时取消旧排队任务，防止任务堆积
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "shturl.cc/G9ZlDcIrLN4JtbKAp57qYt0IH2jnGaJIPStbz"
          CHECK_CONCURRENCY: "16"   # 调低并发，免费Runner网络弱，32容易爆
          CHECK_TIMEOUT: "60"       # 降低超时时间

      # ========= 删除废弃的Pages curl PUT API（该接口已经失效，会报错）=========
      # 👉 请手动去仓库 Settings → Pages 手动设置 Source = GitHub Actions

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: echo "site: https://jerylihub.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"
